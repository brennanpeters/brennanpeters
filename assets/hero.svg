<svg width="900" height="432" viewBox="0 0 900 432" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title">
  <title id="title">Hi, I'm Brennan Peters, a software developer and entrepreneur</title>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17172B"/>
      <stop offset="0.5" stop-color="#131316"/>
      <stop offset="1" stop-color="#1B1428"/>
    </linearGradient>
    <style>
      .wave { transform-box: fill-box; transform-origin: 70% 70%; animation: wave 3s ease-in-out infinite; }
      @keyframes wave {
        0%, 55%, 100% { transform: rotate(0deg); }
        10% { transform: rotate(14deg); }
        20% { transform: rotate(-8deg); }
        30% { transform: rotate(14deg); }
        40% { transform: rotate(-4deg); }
        50% { transform: rotate(10deg); }
      }
      @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
    </style>
  </defs>
  <rect x="12" y="12" width="876" height="408" rx="40" fill="#141417"/>
  <rect x="560" y="24" width="316" height="384" rx="36" fill="url(#stage)"/>
  <text class="wave" fill="#F4F4F5" x="718" y="270" font-size="160" text-anchor="middle">👋</text>
  <text x="60" y="138" fill="#F4F4F5" font-size="64" font-weight="500" letter-spacing="-1.6">Hi, I'm</text>
  <text x="60" y="208" fill="#F4F4F5" font-size="64" font-weight="500" letter-spacing="-1.6">Brennan Peters</text>
  <text x="62" y="260" fill="#A1A1AA" font-size="24" font-weight="300">a software developer and entrepreneur.</text>
  <text x="62" y="314" fill="#71717A" font-size="19" font-weight="400">I design and ship products end to end.</text>
  <text x="62" y="342" fill="#71717A" font-size="19" font-weight="400">Interfaces, APIs, and infrastructure,</text>
  <text x="62" y="370" fill="#71717A" font-size="19" font-weight="400">with a focus on clarity and speed.</text>
</svg>
